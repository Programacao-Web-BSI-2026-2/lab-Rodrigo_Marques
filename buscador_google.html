<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Exemplo formulario para busca no google">
    <meta name="keywords" content="html, formulario, google">
    <meta name="robots" content="index,follow">
    <meta name="author" content="Rodrigo Marques">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
</head>
<body>
    <form action="http://www.google.com.br/search" method="get">
        <label for="pesquisa">Pesquisar:</label>
        <input type="search" name="q" value="" id="pesquisa" placeholder="Digite aqui">
        <input type="submit" name="name" value="Buscar">
        <input type="reset" name="name" value="limpar">
    </form>
</body>
</html>
